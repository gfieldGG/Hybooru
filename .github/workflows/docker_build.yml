name: Containers
on:
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: [ubuntu-latest]
    steps:
      -
        name: Checkout
        uses: actions/checkout@v6
      -
        # Pushes to master tag the package.json version if it is a new fork release (x.y.z-gf.N).
        # The tag is created here because tags pushed with GITHUB_TOKEN do not trigger other workflows.
        name: Release tag
        id: release
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version=$(jq -r .version package.json)
          tag="v$version"
          if ! [[ "$version" =~ -gf\.[0-9]+$ ]]; then
            echo "::notice::Version $version is not a fork release, skipping build"
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::notice::Tag $tag already exists, skipping build"
            exit 0
          fi

          git tag "$tag"
          git push origin "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      -
        name: Docker meta
        id: docker_meta
        if: steps.release.outputs.tag
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/hybooru
          tags: |
            type=raw,value=${{ steps.release.outputs.tag }}
          flavor: |
            latest=true
          labels: |
            org.opencontainers.image.title=Hybooru
            org.opencontainers.image.description=Hydrus-based booru-styled imageboard in React, inspired by hyve.
            org.opencontainers.image.vendor=${{ github.repository_owner }}
      -
        name: Set up QEMU
        if: steps.release.outputs.tag
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        if: steps.release.outputs.tag
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-flags: "--debug"
      -
        name: Login to GitHub Container Registry
        if: steps.release.outputs.tag
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Docker Build
        if: steps.release.outputs.tag
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          file: ./Dockerfile
          platforms: linux/amd64
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
